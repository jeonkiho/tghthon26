# 세라프 TUI 설정. 코드를 고치지 않고 여기만 바꾼다.
#
# mode 를 바꾸면 접속 대상이 바뀐다:
#   mock   - tests/fixtures 의 저장된 출력을 읽는다. 서버 불필요. (기본값)
#   ssh    - 실제 세라프에 접속한다.

connection:
  mode: mock
  host: ariel               # ~/.ssh/config 의 Host 이름을 그대로 쓴다
  poll_interval_seconds: 7  # 5~10초. 이보다 자주 부르지 않는다
  login_node_load_limit: 8.0  # 1분 load 가 이 이상이면 폴링을 쉰다

cluster:
  default_partition: batch_grad

lint:
  # 학습 데이터를 여기서 바로 읽으면 안 된다. 노드 로컬로 복사해서 쓴다.
  # 실제 마운트 지점을 확인해서 적은 것이다 (`/nas` 는 존재하지 않는다).
  #
  # 주의: 아래 정책은 세라프 운영 규칙을 그대로 옮긴 것이 아니라 팀이 정한 값이다.
  # 조교/관리자에게 확인한 뒤 확정할 것.
  blocked_paths:
    - /nas2/
  warn_paths:
    - /ceph_data/   # 공유 스토리지. 대용량 반복 읽기는 피한다
    - /home/        # 루트 파일시스템(96% 사용 중)에 있다. 학습 데이터용이 아니다

sbatch:
  # generate_sbatch() 기본값
  default_cpus_per_task: 8
  default_mem: 32G
  default_time: "24:00:00"
  output_pattern: "slurm-%j.out"   # %j = job id

slack:
  # TUI 에서 보여줄 Slack 공지 채널. 이름(#없이) 또는 채널 ID.
  channel: 공지
  limit: 10

  # 토큰은 여기 적지 않는다. 이 파일은 커밋되기 때문이다.
  # 환경변수로만 받는다:
  #   export SERAPH_SLACK_TOKEN='xoxb-...'
  # 없으면 저장된 mock 공지를 보여준다 (프론트 개발용).

notify:
  # (읽기가 아니라 보내는 쪽. 지금은 쓰지 않는다.)
  # Slack Incoming Webhook URL. 비워두면 알림을 보내지 않는다.
  # 환경변수 SERAPH_SLACK_WEBHOOK 이 있으면 그쪽이 우선한다.
  slack_webhook_url: null
